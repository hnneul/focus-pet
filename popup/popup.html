<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>focus-pet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img id="pet" src="../icons/calm.png" alt="평온한 병아리" width="64" height="64">
    <div>
      <h1>focus-pet</h1>
      <p class="sub">딴짓하면 화내는 펫</p>
    </div>
  </header>

  <section>
    <h2>할 일</h2>
    <form id="todo-form" novalidate>
      <input id="todo-title" type="text" placeholder="예: 인프 발표 자료" maxlength="60" aria-label="할 일 제목">
      <div class="row">
        <input id="todo-due" type="datetime-local" aria-label="마감 날짜와 시간">
        <button type="submit">추가</button>
      </div>
      <p id="todo-error" class="error" role="alert" hidden></p>
    </form>
    <ul id="todo-list"></ul>
    <p id="todo-empty" class="empty">아직 등록된 할 일이 없어요.</p>
  </section>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
