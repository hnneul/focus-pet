<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>focus-pet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img id="pet" src="../icons/calm.png" alt="평온한 병아리" width="64" height="64">
    <div>
      <h1>focus-pet</h1>
      <p class="sub">시간 도둑 앞에서 화내는 펫</p>
    </div>
    <p id="cheer" class="cheer" role="status" hidden></p>
  </header>
  <p class="today">오늘 도둑맞은 시간 <b id="today-time">0분</b> · 스트레스 <b id="stress">0</b> <span id="stage">평온</span></p>

  <section>
    <h2>할 일</h2>
    <form id="todo-form" novalidate>
      <input id="todo-title" type="text" placeholder="예: 인프 발표 자료" maxlength="60" aria-label="할 일 제목">
      <div class="row">
        <input id="todo-due" type="datetime-local" aria-label="마감 날짜와 시간">
        <button type="submit">추가</button>
      </div>
      <p id="todo-error" class="error" role="alert" hidden></p>
    </form>
    <ul id="todo-list"></ul>
    <p id="todo-empty" class="empty">아직 등록된 할 일이 없어요.</p>
  </section>

  <section>
    <h2>시간 도둑 목록</h2>
    <form id="site-form" class="row" novalidate>
      <input id="site-input" type="text" placeholder="예: youtube.com" aria-label="시간 도둑 사이트 주소">
      <button type="submit">추가</button>
    </form>
    <p id="site-error" class="error" role="alert" hidden></p>
    <ul id="site-list" class="chips"></ul>
  </section>

  <section class="settings">
    <label>펫 이름 <input id="pet-name" type="text" maxlength="10" placeholder="삐약이"></label>
    <label><input id="demo" type="checkbox"> 데모 모드 (1분을 10초로 계산)</label>
  </section>

  <script src="../config.js"></script>
  <script src="../sites.js"></script>
  <script src="../stress.js"></script>
  <script src="popup.js"></script>
</body>
</html>
